<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090e"><meta name="description" content="用手势点亮一棵属于你的金色粒子圣诞树，收藏照片与冬日心愿。">
<title>星愿 · Christmas in your hands</title><link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene" aria-label="可交互的金色粒子圣诞树，点击散开或聚拢，拖动旋转"></canvas>
<header><a class="wordmark" href="./"><span>✧</span> 星愿 <i>WINTER COLLECTION</i></a><button id="fullscreen" class="icon-button" aria-label="切换全屏" title="全屏">⛶</button></header>
<main class="title"><p class="eyebrow">A LITTLE MAGIC, JUST FOR YOU</p><h1>Merry Christmas</h1><p class="wish">把心愿，藏进每一颗星光</p></main>
<div class="scene-label"><span class="live-dot"></span><span id="state-label">星光正在聚拢</span></div>
<aside class="camera-panel" hidden><video id="camera" autoplay playsinline muted></video><div id="camera-state">等待手势</div></aside>
<div class="toolbar"><button id="camera-toggle" class="primary"><span>◎</span> 开启手势</button><button id="scatter">✧ 散开星光</button><button id="photos">▧ 放入照片</button><button id="demo" aria-pressed="false">↻ 自动演示</button><input id="photo-input" type="file" accept="image/*" multiple hidden></div>
<footer><div class="instructions"><span>张开手 · 星光散开</span><b>·</b><span>握拳 · 圣诞树聚拢</span><b>·</b><span>捏合 · 查看照片</span></div><p id="hint" role="status" aria-live="polite">也可以点击画面切换，拖动旋转，滚轮缩放</p><small>MADE OF STARDUST &amp; LITTLE WISHES <span>✦</span> 2026</small></footer>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="photo-dialog"><button id="close-photo" aria-label="关闭照片">×</button><img id="large-photo" alt="圣诞树中的照片"><p>愿每个温暖瞬间，都闪闪发光。</p></dialog>
<script type="module" src="app.js"></script>
</body></html>
